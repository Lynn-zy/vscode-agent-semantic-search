name: Release Extension

# 触发机制：推送版本标签（例如 v0.1.5）或在 Actions 页面手动运行
on:
  push:
    # 监听以 'v' 开头的版本标签推送（例如 v0.1.5、v1.0.0）
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "发布的目标标签名称（例如 v0.1.5，留空则使用当前 ref）"
        required: false
        type: string

# 授予创建 GitHub Release 与上传资产所需的权限
permissions:
  contents: write

jobs:
  release:
    name: 构建并发布 VSIX
    runs-on: ubuntu-latest

    steps:
      # 第一步：检出仓库代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 第二步：安装并配置 Node.js 运行环境与 npm 缓存
      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      # 第三步：安装依赖（使用 npm ci 确保与 package-lock.json 严格一致）
      - name: 安装项目依赖
        run: npm ci

      # 第四步：执行全量编译与自动化测试，测试不通过则阻断发布
      - name: 执行测试与编译
        run: npm test

      # 第五步：调用 vsce 打包为 .vsix 格式扩展文件
      - name: 打包 VSIX 扩展文件
        run: npm run package

      # 第六步：解析最终使用的 Release 标签名称
      - name: 解析 Release 标签
        id: tag_info
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            echo "tag=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # 第七步：创建 GitHub Release 并上传 .vsix 打包产物
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.tag }}
          name: Release ${{ steps.tag_info.outputs.tag }}
          files: "*.vsix"
          generate_release_notes: true
        env:
          # 使用 Actions 自动提供的 GITHUB_TOKEN 进行鉴权
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
